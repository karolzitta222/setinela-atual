
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento - Hospital Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <a class="voltar" href="index.html">← Voltar ao login</a>

    <h2>Atendimento Hospitalar</h2>
    <p class="subtitulo">Cadastro de pacientes para triagem</p>

    <form id="formAtendimento">
        <label for="nome">Nome do paciente</label>
        <input id="nome" type="text"
               placeholder="Nome completo" required>

        <label for="cpf">CPF</label>
        <input id="cpf" type="text"
               placeholder="CPF do paciente" required>

        <label for="tipo">Tipo de atendimento</label>
        <select id="tipo" required>
            <option value="Convenio">Convênio</option>
            <option value="Particular">Particular</option>
        </select>

        <button id="botaoCadastrar" type="submit">
            Cadastrar paciente
        </button>
    </form>

    <p id="mensagem" class="mensagem" role="status"></p>
</div>

<script>
const form = document.getElementById("formAtendimento");
const mensagem = document.getElementById("mensagem");
const botao = document.getElementById("botaoCadastrar");

form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const cpf = document.getElementById("cpf").value.trim();
    const tipo = document.getElementById("tipo").value;

    botao.disabled = true;
    mensagem.textContent = "Cadastrando paciente...";

    try {
        const resposta = await fetch("/atendimento", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ nome, cpf, tipo })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
            throw new Error(dados.erro || "Erro ao cadastrar.");
        }

        mensagem.textContent =
            "Paciente cadastrado e enviado para a triagem!";

        form.reset();

    } catch (erro) {
        mensagem.textContent =
            "Não foi possível cadastrar. Confira se o servidor está ligado.";

        console.error("Erro no atendimento:", erro);

    } finally {
        botao.disabled = false;
    }
});
</script>

</body>
</html>
