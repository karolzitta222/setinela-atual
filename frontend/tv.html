
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Hospitalar - TV</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #9dccf2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .tv-container {
            display: flex;
            width: 95vw;
            height: 90vh;
            gap: 18px;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            width: 35%;
            gap: 18px;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            width: 65%;
            gap: 25px;
            min-width: 0;
        }

        .box {
            background: white;
            border: 2px solid #c8ced2;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(74, 0, 85, .18);
            min-width: 0;
        }

        .box-title {
            color: #8f00c9;
            font-size: 2.2vw;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .local-box {
            flex: 1;
            background: #eed9f8;
        }

        .local-number {
            color: #a900e6;
            font-size: 9vw;
            font-weight: bold;
            line-height: 1;
        }

        .history-box {
            flex: 1;
            justify-content: flex-start;
            background: #f0dcf9;
            overflow: hidden;
        }

        .history-box .box-title {
            font-size: 1.8vw;
            color: #76008c;
        }

        #history-list {
            list-style: none;
            width: 100%;
            color: #7800a3;
            font-size: 1.5vw;
            font-weight: bold;
            text-align: left;
        }

        #history-list li {
            margin-bottom: 8px;
            border-bottom: 1px solid #cdb6d7;
            padding-bottom: 5px;
            overflow-wrap: anywhere;
        }

        .patient-box {
            flex: 3;
            background: #fafafa;
            border: 3px solid #c8ced2;
        }

        .patient-name {
            color: #a900e6;
            font-size: 6.5vw;
            font-weight: bold;
            line-height: 1.2;
            overflow-wrap: anywhere;
        }

        .logo-box {
            flex: 1;
            background: #70007f;
        }

        .logo-text {
            color: white;
            font-size: 3.5vw;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status {
            color: #66558f;
            font-size: 14px;
            margin-top: 10px;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: .3; }
        }

        .flash {
            animation: flash .5s ease 3;
        }

        @media (max-width: 700px) {
            .tv-container {
                gap: 10px;
            }

            .left-panel {
                gap: 10px;
            }

            .right-panel {
                gap: 15px;
            }

            .box {
                padding: 10px;
            }

            .box-title {
                font-size: 3vw;
            }

            .history-box .box-title {
                font-size: 2.8vw;
            }

            #history-list {
                font-size: 2.5vw;
            }

            .patient-name {
                font-size: 6vw;
            }

            .logo-text {
                font-size: 3vw;
            }
        }
    </style>
</head>

<body>
    <main class="tv-container">
        <section class="left-panel">
            <div class="box local-box">
                <div class="box-title" id="local-tipo">GUICHÊ</div>
                <div class="local-number" id="local-numero">---</div>
            </div>

            <div class="box history-box">
                <div class="box-title">ÚLTIMAS CHAMADAS</div>
                <ul id="history-list"></ul>
            </div>
        </section>

        <section class="right-panel">
            <div class="box patient-box">
                <div class="box-title">PACIENTE</div>
                <div class="patient-name" id="patient-name">
                    AGUARDANDO...
                </div>
                <div class="status" id="status">Conectando ao servidor...</div>
            </div>

            <div class="box logo-box">
                <div class="logo-text">Sistema Hospitalar</div>
            </div>
        </section>
    </main>

    <script>
        let ultimoID = null;

        async function atualizar() {
            const status = document.getElementById("status");

            try {
                const resposta = await fetch("/tv/chamada", {
                    cache: "no-store"
                });

                if (!resposta.ok) {
                    throw new Error("Erro HTTP " + resposta.status);
                }

                const dados = await resposta.json();
                const chamada = dados.chamada;
                const historico = Array.isArray(dados.historico)
                    ? dados.historico
                    : [];

                if (chamada) {
                    document.getElementById("local-tipo").textContent =
                        chamada.localTipo || "GUICHÊ";

                    document.getElementById("local-numero").textContent =
                        chamada.localNumero || "01";

                    document.getElementById("patient-name").textContent =
                        chamada.paciente || "AGUARDANDO...";

                    status.textContent = "Tela conectada";

                    if (chamada.id !== ultimoID) {
                        ultimoID = chamada.id;

                        const caixa =
                            document.querySelector(".patient-box");

                        caixa.classList.remove("flash");
                        void caixa.offsetWidth;
                        caixa.classList.add("flash");
                    }
                } else {
                    status.textContent = "Aguardando próxima chamada";
                }

                const lista = document.getElementById("history-list");
                lista.replaceChildren();

                historico.slice(0, 4).forEach(item => {
                    const li = document.createElement("li");

                    li.textContent =
                        `${item.localTipo || "GUICHÊ"} ` +
                        `${item.localNumero || "01"} - ` +
                        `${item.paciente || "Paciente"}`;

                    lista.appendChild(li);
                });

            } catch (erro) {
                console.error("Erro ao atualizar TV:", erro);
                status.textContent = "Erro de conexão com o servidor";
            }
        }

        atualizar();
        setInterval(atualizar, 2000);
    </script>
</body>
</html>
